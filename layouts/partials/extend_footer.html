{{- /* MizuMakes: GA4 event (deal_dest = store or amazon) when a reader clicks through to a deal. Works for the
       deals page, category deal pages, search results and the homepage strip. */ -}}
<script>
(function () {
  function where(a) {
    if (a.closest('#dp-results')) return 'search';
    if (a.closest('#dp-front')) return 'best_today';
    if (a.closest('.dp-home')) return location.pathname === '/' ? 'home' : 'category_page_strip';
    return location.pathname.replace(/^\/3d-printer-deals\/?/, '').replace(/\/$/, '') || 'all_deals';
  }
  function track(e) {
    var link = e.target.closest && e.target.closest('a.dp-card-main, a.dp-card-amz');
    var a = link && link.closest('.dp-card');
    if (!a || typeof gtag !== 'function') return;
    if (e.type === 'auxclick' && e.button !== 1) return;     /* middle click only */
    var d = a.dataset;
    gtag('event', 'deal_click', {
      deal_store: d.store || '',
      deal_category: d.cat || '',
      deal_brand: d.brand || '',
      deal_name: (d.name || '').slice(0, 100),
      deal_discount: parseFloat(d.pct) || 0,
      deal_location: where(a),
      deal_dest: link.classList.contains('dp-card-amz') ? 'amazon' : 'store',
      value: parseFloat(d.price) || 0,
      currency: 'USD',
      transport_type: 'beacon'
    });
  }
  document.addEventListener('click', track, true);
  document.addEventListener('auxclick', track, true);
})();
</script>
