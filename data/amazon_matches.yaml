# Exact Amazon matches for store deals (mizumakes only)
# ----------------------------------------------------
# deal_finder.py adds a "Check Amazon" button to a deal card only when ALL of these hold:
#   - the store product page (host + /products/<handle>) is in this list
#   - the item is on today's deal list (so the store sale is real)
#   - amazon_price is the same as or below today's store deal price
#   - today is on or before `until`
#   - the deal's variant matches `variant` (regex, case-insensitive), when given, so a
#     2-pack or 8 kg bundle never gets a button for a single unit on Amazon. Multi-packs
#     ("*2", "x2", "2 pack") are always rejected.
# Amazon prices are never shown on the site (Associates rules); they only decide
# whether the button appears. They come from Jared's Nov 2026 Amazon deals sheet and
# were not checked live, so each entry expires. Add or refresh entries by hand.

tag: mizubikes-web-20

matches:
  - store_url: https://store.anycubic.com/products/kobra-x
    asin: B0GQGSQNF8
    name: Anycubic Kobra X
    amazon_price: 299.99
    source: sheet Nov 16, 2026 (Prime price)
    until: 2026-12-01

  - store_url: https://store.anycubic.com/products/pla-4kg
    variant: "(^|\\D)4\\s?kg"
    asin: B0D53R2W7R
    name: Anycubic PLA 4 kg bundle
