baseURL = "https://mizumakes.com/"
languageCode = "en-us"
title = "MizuMakes"
theme = "PaperMod"

[services]
  [services.googleAnalytics]
    id = "G-H121HM747N"

[taxonomies]
  category = "categories"
  tag = "tags"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[outputFormats]
  [outputFormats.RSS]
    mediaType = "application/rss+xml"
    baseName = "feed"

[params]
  description = "3D printing, engineering, and making stuff"
  author = "Jared"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  googleSiteVerification = "MwppcuM3ccw91qgRVYOLtLNzwgxWx_efJt33bIDraOQ"
  [params.cover]
    linkFullImages = true
    hiddenInList = false
    responsiveImages = false

[params.homeInfoParams]
  Title = "Making things that work."
  Content = "3D printing, engineering projects, and gear that's actually worth it."

[[params.socialIcons]]
  name = "youtube"
  url = "https://youtube.com/@MizuMakes3D"

