name: Filament prices

on:
  schedule:
    # Daily at 13:17 UTC (6:17am PDT / 5:17am PST)
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: filament-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Fetch prices
        run: python scripts/filament_prices.py

      - name: Commit updated price data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/filament_prices.json data/filament_history.json
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          git commit -m "Update filament prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
