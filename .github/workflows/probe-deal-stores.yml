name: Probe deal stores
on:
  push:
    branches: [probe-deal-stores]
    paths: [scripts/deal_finder.py, data/deal_stores.yaml, .github/workflows/probe-deal-stores.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests pyyaml
      - run: python scripts/deal_finder.py
      - name: Save results on this test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/deal_history.json static/deals-all.json
          git commit -m "Test scan results"
          git push origin HEAD:probe-deal-stores
